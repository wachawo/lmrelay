# fail2ban jail for lmrelay. Install to /etc/fail2ban/jail.d/lmrelay.conf.
#
# DISABLED ON PURPOSE. Read this before changing it.
#
# lmrelay runs uvicorn with forwarded_allow_ips="*", so it takes the client
# address from X-Forwarded-For when that header is present, whoever sent it.
# Against a relay that callers reach directly, anyone can pair a wrong token
# with a forged header and choose the address this jail bans — a gateway, a
# colleague, or the operator. Verified: a request carrying
# "X-Forwarded-For: 198.51.100.42" and a bad token logs 198.51.100.42.
#
# The jail is therefore safe in one arrangement only: the relay bound to
# 127.0.0.1 with a trusted reverse proxy as the sole route in, so the header
# can only have come from that proxy. Enable it then. A relay listening on
# 0.0.0.0 must not run this jail.
#
# logpath is where a detached relay writes; `lmrelay status` prints the path.

[lmrelay]

enabled  = false
filter   = lmrelay-auth
logpath  = /home/YOUR_USER/.lmrelay/lmrelay.log
port     = 11435
maxretry = 5
findtime = 10m
bantime  = 1h
