# fail2ban jail for lmrelay. Install to /etc/fail2ban/jail.d/lmrelay.conf.
#
# Disabled as shipped only because logpath below names a placeholder user: set
# it, then enable the jail.
#
# The address it bans is the caller's own. uvicorn believes X-Forwarded-For only
# from loopback, so a remote caller cannot forge the header to choose whom this
# jail bans. A proxy on another machine trusted through FORWARDED_ALLOW_IPS makes
# the jail exactly as honest as that proxy.
#
# logpath is where a detached relay writes; `lmrelay status` prints the path.

[lmrelay]

enabled  = false
filter   = lmrelay
logpath  = /home/YOUR_USER/.lmrelay/lmrelay.log
port     = 11435
maxretry = 5
findtime = 10m
bantime  = 1h
