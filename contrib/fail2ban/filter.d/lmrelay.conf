# fail2ban filter for lmrelay's own log.
#
# Matches the relay refusing a caller's credential, and only that. A 401 that
# came from an upstream and was relayed through, such as an expired provider key,
# reaches the log as a served request and is deliberately not matched here: the
# caller whose key stopped working is not an attacker.
#
# Install to /etc/fail2ban/filter.d/lmrelay.conf and test with:
#   fail2ban-regex ~/.lmrelay/lmrelay.log /etc/fail2ban/filter.d/lmrelay.conf
#
# fail2ban strips what datepattern matched before applying failregex, which is
# why the expression starts at [WARNING] and not at the timestamp. The percent
# signs are doubled because fail2ban interpolates its own config files.
#
# The bracketed field between the logger name and the address is the request id,
# eight hex characters, which every line the relay writes now carries. It has to
# be matched and stepped over: <HOST> cannot absorb it, because a bracket is not
# in the character class fail2ban expands <HOST> to, so an expression that looks
# for the address immediately after (lmrelay.app) matches nothing at all and the
# jail stops banning without saying so.

[Definition]

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f

failregex   = ^\s*\[WARNING\]: \(lmrelay\.app\) \[[0-9a-f]+\] <HOST> \S+ \S+ -> -: 401 \(auth\)$

ignoreregex =
