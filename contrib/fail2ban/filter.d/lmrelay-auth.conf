# fail2ban filter for lmrelay's own log.
#
# Matches the relay refusing a caller's credential, and only that. A 401 that
# came from an upstream and was relayed through — an expired provider key —
# reaches the log as a served request and is deliberately not matched here: the
# caller whose key stopped working is not an attacker.
#
# Install to /etc/fail2ban/filter.d/lmrelay-auth.conf and test with:
#   fail2ban-regex ~/.lmrelay/lmrelay.log /etc/fail2ban/filter.d/lmrelay-auth.conf
#
# fail2ban strips what datepattern matched before applying failregex, which is
# why the expression starts at [WARNING] and not at the timestamp. The percent
# signs are doubled because fail2ban interpolates its own config files.

[Definition]

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S\.%%f

failregex   = ^\s*\[WARNING\]: \(lmrelay\.app\) <HOST> \S+ \S+ -> -: 401 \(auth\)$

ignoreregex =
