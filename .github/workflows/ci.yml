name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the tree. Saying so keeps the repository default
# (often contents:write) out of a job that runs the build backend and a suite
# that forks and binds sockets.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # One interpreter, not the test matrix: `target-version = "py311"` is
      # fixed in pyproject.toml, so every other leg would lint the same tree
      # against the same target for the same answer.
      #
      # Pinned to the series .pre-commit-config.yaml uses, so a commit the
      # local hook accepts is one CI accepts: an unpinned linter turns a new
      # rule in someone else's release into a red build on an unchanged tree.
      # The package is installed so mypy sees the FastAPI and httpx types.
      - name: Install
        run: pip install -e . 'ruff~=0.16.5' 'mypy~=2.4.0'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy lmrelay

  test:
    runs-on: ${{ matrix.os }}
    # The suite forks, binds sockets and runs uvicorn. Without this a child
    # that will not exit holds the runner for the 360-minute default, once per
    # matrix leg.
    timeout-minutes: 15
    strategy:
      # Every interpreter reports: the classifiers promise all three, and a
      # failure on one must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # One macOS leg, not a second sweep. Not for service.py: the tests
        # reach detect_manager's darwin branch on ubuntu by faking sys.platform,
        # and drive the launchd registration on every OS with launchctl
        # stubbed. It is here for what cannot be faked: a real fork, real
        # sockets and a real uvicorn on the other OS the classifiers promise.
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[test]'

      # The legacy junit family is the one Codecov's test analytics reads.
      - name: Test
        run: pytest --cov=lmrelay --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      # Every leg uploads; Codecov merges them into one report, so a line only
      # one interpreter reaches still counts as covered.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Not skipped on a red run: a failed test is exactly what test analytics
      # is for, so the results go up whether or not the step above did.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
