# Install once per clone: `pre-commit install --hook-type pre-commit --hook-type pre-push`.
# ruff runs on every commit; the test suite runs before a push, where its 15 seconds
# are not paid per commit. ruff format is deliberately absent: the code aligns
# assignments in columns, which the formatter would flatten.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
