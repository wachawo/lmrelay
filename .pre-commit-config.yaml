# Install once per clone: `pre-commit install --hook-type pre-commit --hook-type pre-push`.
# ruff and mypy run on every commit; the test suite runs before a push, where its 15 seconds
# are not paid per commit. ruff format is deliberately absent: the code aligns
# assignments in columns, which the formatter would flatten.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # `language: python`, not `system`: a bare `pytest` on PATH is missing
        # whenever the suite normally runs from a virtualenv, and the hook then
        # refused every push. pre-commit builds and caches this environment.
        #
        # The dependencies are spelled out rather than taken from `.[test]`,
        # which pre-commit resolves against its own directory and which brought
        # in no pytest. lmrelay itself is imported from the working tree.
        entry: pytest
        language: python
        additional_dependencies:
          - pytest>=8
          - anyio>=4
          - httpx2>=2
          - pytest-cov>=5
          - fastapi>=0.115,<1
          - starlette>=0.37,<2
          - uvicorn[standard]>=0.30,<1
          - httpx>=0.27,<1
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy
        # The same pin as the CI lint job, and the runtime dependencies so the
        # FastAPI and httpx types are checked rather than treated as Any.
        entry: mypy lmrelay
        language: python
        additional_dependencies:
          - mypy~=2.4.0
          - fastapi>=0.115,<1
          - starlette>=0.37,<2
          - uvicorn[standard]>=0.30,<1
          - httpx>=0.27,<1
        pass_filenames: false
        types: [python]
