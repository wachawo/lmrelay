[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmrelay"
dynamic = ["version"]
description = "Credentialed passthrough in front of a local Ollama, retargetable at a hosted provider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "lmrelay contributors" }]
keywords = ["ollama", "llm", "proxy", "relay", "openai", "anthropic", "deepseek", "grok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# `pip install -e '.[test]'` then `pytest`. httpx is already a runtime
# dependency and is what the tests drive the relay with.
test = ["pytest>=8"]

[project.scripts]
lmrelay = "lmrelay.cli:main"

[project.urls]
Homepage = "https://github.com/wachawo/lmrelay"
Repository = "https://github.com/wachawo/lmrelay"
Issues = "https://github.com/wachawo/lmrelay/issues"

[tool.hatch.version]
path = "lmrelay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lmrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode and rootdir together let the suite import `tests.conftest` for the
# shared fixtures while `lmrelay` resolves to the source tree, not an installed
# copy — so a test run cannot pass against a build made before the edit.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Project style forbids underscore-prefixed identifiers, so deliberately
# discarded slots are named `unused...` instead of `_`.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|unused[a-zA-Z0-9_]*)$"
ignore = [
  "E501",   # line too long — the wide constant blocks read better aligned
  "UP009",  # UTF-8 coding declaration — required by project style guide
  "B904",   # raise from inside except — config errors deliberately hide the cause
  "RUF010", # str(exc) over {exc!s} — the project's error-logging form is literal
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
