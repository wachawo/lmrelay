[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmrelay"
dynamic = ["version"]
description = "Credentialed relay beside a local Ollama, retargetable at a hosted provider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "lmrelay contributors" }]
keywords = [
  "ollama", "llm", "proxy", "reverse-proxy", "relay", "cli", "self-hosted", "fastapi",
  "openai", "anthropic", "deepseek", "grok",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  # Windows stays on the list: `lmrelay run` works there. Only the detached
  # and autostart commands are POSIX-only, and they say so and exit.
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Framework :: FastAPI",
]
dependencies = [
  # Upper bounds, not `==` pins: lmrelay installs as an ordinary package, often
  # beside other things that want fastapi, and an equality pin would make it
  # unco-installable.
  "fastapi>=0.115,<1",
  # starlette is named here because the relay imports it directly and fastapi
  # no longer caps it: 0.141 asks for `starlette>=0.46.0` with no ceiling, so
  # bounding fastapi bounds nothing. starlette is past 1.0 while fastapi is
  # not, which is why this ceiling is the only one that is not `<1`.
  "starlette>=0.37,<2",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# `pip install -e '.[test]'` then `pytest`. httpx is already a runtime
# dependency and is what the tests drive the relay with. anyio is named because
# the tests import it themselves; it would otherwise arrive only as something
# starlette happens to depend on.
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
lmrelay = "lmrelay.cli:main"

[project.urls]
Homepage = "https://github.com/wachawo/lmrelay"
Repository = "https://github.com/wachawo/lmrelay"
Issues = "https://github.com/wachawo/lmrelay/issues"

[tool.hatch.version]
path = "lmrelay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lmrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode and rootdir together let the suite import `tests.conftest` for the
# shared fixtures while `lmrelay` resolves to the source tree, not an installed
# copy — so a test run cannot pass against a build made before the edit.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Project style forbids underscore-prefixed identifiers, so deliberately
# discarded slots are named `unused...` instead of `_`.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|unused[a-zA-Z0-9_]*)$"
ignore = [
  "E501",   # line too long — the wide constant blocks read better aligned
  "UP009",  # UTF-8 coding declaration — required by project style guide
  "B904",   # raise from inside except — config errors deliberately hide the cause
  "RUF010", # str(exc) over {exc!s} — the project's error-logging form is literal
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
